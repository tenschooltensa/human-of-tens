<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Human of TENS</title>
<meta name="theme-color" content="#0F5257">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Human of TENS">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --chinh:#0F5257;--chinh2:#13707A;--nhan:#F2A33A;--nhan-dam:#B9741A;--nen-nhan:#FDF3E3;--nen:#F2F6F5;--nhat:#E1EFEE;--phu:#BFDCD9;--phu2:#FAD9A6;
  --the:#fff;--chu:#1B2A2C;--mo:#64746F;--vien:#E0E8E6;
  --xanh:#1E9E5A;--xanh-nen:#E6F6EE;--do:#D93838;--do-nen:#FDEAEA;--vang:#B47B00;--vang-nen:#FFF6DD;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--nen);color:var(--chu);font-size:14px}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--chu)}
.an{display:none!important}

/* ---------- Đăng nhập ---------- */
#dangNhap,#choMo{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--chinh) 0%,var(--chinh2) 100%)}
.hopDN{background:#fff;border-radius:20px;padding:28px 24px;width:100%;max-width:380px;box-shadow:0 20px 40px rgba(0,0,0,.18)}
.logoLon{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--nhan);display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;flex:none}
.tenApp{line-height:1}.tenApp small{display:block;font-size:11px;letter-spacing:2.5px;color:var(--mo);font-weight:700;margin-bottom:3px}
.tenApp b{font-size:24px;font-weight:800;color:var(--chinh);letter-spacing:.5px}
.hopDN h2{font-size:17px;margin-bottom:6px}.hopDN p{color:var(--mo);font-size:13px;margin-bottom:16px;line-height:1.5}
.o{width:100%;border:1.5px solid var(--vien);border-radius:12px;padding:12px 14px;outline:none;background:#fff}
.o:focus{border-color:var(--chinh2)}
.nutChinh{width:100%;background:var(--nhan);color:#fff;font-weight:700;font-size:15px;border-radius:12px;padding:14px;margin-top:12px;box-shadow:0 6px 14px rgba(242,163,58,.35)}
.nutChinh:disabled{opacity:.55;box-shadow:none}
.nutPhu{width:100%;color:var(--chinh2);font-weight:600;padding:10px;margin-top:6px}
.loiDN{color:var(--do);font-size:13px;margin-top:10px;min-height:18px}

/* ---------- Khung app ---------- */
#app{min-height:100%;display:flex}
.sidebar{display:none}
.chinh{flex:1;min-width:0;padding-bottom:84px}
.dau{background:var(--chinh);color:#fff;padding:16px 18px 22px;position:relative}
.dau .hang{display:flex;align-items:center;gap:10px}
.dau .logo{width:32px;height:32px;font-size:16px;border-radius:9px}
.dau .tenApp small{color:var(--phu2);font-size:9.5px}.dau .tenApp b{color:#fff;font-size:17px}
.dau .chuong{margin-left:auto;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;position:relative;font-size:16px}
.dau .chuong i{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:8px;background:var(--nhan);font-size:10px;font-style:normal;font-weight:700;display:grid;place-items:center;padding:0 4px}
.chao{margin-top:14px;color:var(--phu);font-size:13px}.chao b{display:block;color:#fff;font-size:19px;margin-top:2px}
.tieuDeTrang{font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.tieuDeTrang .lui{font-size:22px;opacity:.85;padding:0 4px}
.noiDung{padding:14px;max-width:1100px}
.the{background:var(--the);border-radius:16px;padding:14px 16px;box-shadow:0 2px 10px rgba(15,82,87,.06)}
h3.muc{font-size:14.5px;font-weight:700;margin:20px 2px 10px;display:flex;justify-content:space-between;align-items:center}
h3.muc a{font-size:12.5px;color:var(--chinh2);font-weight:600;cursor:pointer}
.soLieu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:-34px;position:relative}
.so{background:#fff;border-radius:14px;padding:12px 11px;box-shadow:0 4px 14px rgba(15,82,87,.10)}
.so .n{font-size:22px;font-weight:800;color:var(--chinh)}.so .n small{font-size:12px;color:var(--mo);font-weight:600}
.so .l{font-size:11.5px;color:var(--mo);margin-top:2px;line-height:1.35}
.so.cam .n{color:var(--nhan-dam)}.so.do .n{color:var(--do)}
.nhanh{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nhanh button{background:#fff;border-radius:14px;padding:13px 4px 11px;font-size:12px;font-weight:600;box-shadow:0 2px 8px rgba(15,82,87,.06)}
.nhanh .ic{width:42px;height:42px;border-radius:12px;margin:0 auto 7px;display:grid;place-items:center;font-size:20px}
.ca{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--vien)}
.ca:last-child{border:0}
.ngay{width:46px;text-align:center;border-radius:11px;padding:6px 0;background:var(--nen);font-size:10.5px;color:var(--mo);font-weight:600;flex:none}
.ngay b{display:block;font-size:17px;color:var(--chu)}
.ngay.homNay{background:var(--chinh);color:var(--phu)}.ngay.homNay b{color:#fff}
.caTT{flex:1;font-weight:600;font-size:13.5px;min-width:0}.caTT span{display:block;font-size:11.5px;color:var(--mo);font-weight:500;margin-top:2px}
.nhanTag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap}
.t-vp{background:var(--nhat);color:var(--chinh2)}.t-onl{background:var(--xanh-nen);color:var(--xanh)}
.t-cho{background:var(--vang-nen);color:var(--vang)}.t-ok{background:var(--xanh-nen);color:var(--xanh)}
.t-no{background:var(--do-nen);color:var(--do)}.t-huy{background:#EEF1F0;color:var(--mo)}
.t-nghi{background:var(--nen-nhan);color:var(--nhan-dam)}
.don{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--vien)}
.don:last-child{border:0}
.don .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:none}
.don .tt{flex:1;font-weight:600;min-width:0}.don .tt span{display:block;font-size:12px;color:var(--mo);font-weight:500;margin-top:2px}
.trong{text-align:center;color:var(--mo);padding:22px 10px;font-size:13px}

/* nav dưới */
.navDuoi{position:fixed;bottom:0;left:0;right:0;height:70px;background:#fff;border-top:1px solid var(--vien);display:flex;justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.navDuoi button{font-size:10.5px;color:var(--mo);font-weight:600;text-align:center;flex:1;position:relative}
.navDuoi button b{display:block;font-size:20px;font-weight:400;margin-bottom:2px}
.navDuoi button.on{color:var(--chinh)}
.navDuoi .cong{flex:none;width:54px;height:54px;border-radius:17px;background:var(--nhan);color:#fff;font-size:30px;font-weight:400;margin-top:-26px;box-shadow:0 6px 16px rgba(242,163,58,.5)}
.huy{position:absolute;top:-4px;left:50%;margin-left:6px;min-width:17px;height:17px;border-radius:9px;background:var(--do);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}

/* form */
.chonLoai{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.chonLoai button{background:#fff;border:1.5px solid var(--vien);border-radius:12px;padding:10px 4px;font-size:12px;font-weight:600}
.chonLoai button span{display:block;font-size:19px;margin-bottom:3px}
.chonLoai button.on{border-color:var(--chinh2);background:var(--nhat);color:var(--chinh)}
label.nhan{display:block;font-size:12.5px;font-weight:600;color:var(--mo);margin:15px 2px 6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 30%;background:#fff;border:1.5px solid var(--vien);border-radius:10px;padding:10px 6px;font-size:12.5px;font-weight:600}
.seg button.on{border-color:var(--chinh2);background:var(--nhat);color:var(--chinh)}
.hai{display:grid;grid-template-columns:1fr 1fr;gap:8px}
textarea.o{height:70px;resize:none}
.tinh{margin-top:14px;background:var(--nen-nhan);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.75}
.tinh .h{display:flex;justify-content:space-between}.tinh b{color:var(--chinh)}
.tinh .h.tong{border-top:1px dashed var(--phu2);margin-top:6px;padding-top:6px;font-weight:700}
.hop{margin-top:10px;display:flex;gap:8px;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.55}
.hop.vang{background:var(--vang-nen);color:#6E4B00}.hop.do{background:var(--do-nen);color:#8E1F1F}.hop.xanh{background:var(--xanh-nen);color:#14653B}
.dinhNut{position:sticky;bottom:78px;margin-top:16px}

/* duyệt */
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{padding:8px 13px;border-radius:20px;font-size:12.5px;font-weight:600;background:#fff;color:var(--mo);white-space:nowrap}
.tabs button.on{background:var(--chinh);color:#fff}
.thDuyet{margin-bottom:10px}
.ai{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.ai .tt{flex:1;font-weight:700;min-width:0}.ai .tt span{display:block;font-weight:500;font-size:11.5px;color:var(--mo);margin-top:1px}
.thDuyet .than{font-size:13px;margin-top:10px;line-height:1.6}.thDuyet .than b{color:var(--chinh)}
.dong{margin-top:8px;font-size:12px;border-radius:9px;padding:7px 10px}
.dong.do{background:var(--do-nen);color:#8E1F1F}.dong.xam{background:var(--nen);color:var(--mo)}
.haiNut{display:grid;grid-template-columns:1fr 1.5fr;gap:8px;margin-top:12px}
.haiNut button{padding:11px;border-radius:11px;font-weight:700;font-size:13.5px}
.nTuChoi{background:#fff;border:1.5px solid var(--vien);color:var(--do)}.nDuyet{background:var(--chinh);color:#fff}
.nNho{padding:7px 12px;border-radius:9px;font-weight:700;font-size:12.5px;background:var(--nhat);color:var(--chinh)}

/* tổng quan */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(15,82,87,.06)}
.kpi .l{font-size:12px;color:var(--mo);font-weight:600}.kpi .n{font-size:24px;font-weight:800;color:var(--chinh);margin-top:5px}
.kpi .s{font-size:11.5px;color:var(--mo);margin-top:2px}.kpi.cam .n{color:var(--nhan-dam)}.kpi.do .n{color:var(--do)}
.bang{width:100%;border-collapse:collapse;font-size:12.5px}
.bang th{text-align:left;color:var(--mo);font-weight:600;font-size:11.5px;padding:8px 6px;border-bottom:1px solid var(--vien);background:#FAFCFB}
.bang td{padding:9px 6px;border-bottom:1px solid var(--vien)}
.bang .c{text-align:center}.bang .r{text-align:right}
.cuon{overflow-x:auto}
.loc{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.loc button{font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;background:var(--nen);color:var(--mo)}
.loc button.on{background:var(--chinh);color:#fff}
.cb{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--vien);font-size:13px}
.cb:last-child{border:0}.cb i{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--do)}
.cb span{display:block;color:var(--mo);font-size:12px;margin-top:2px}

/* toast, tải */
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1B2A2C;color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;z-index:50;max-width:90%;text-align:center;opacity:0;transition:.25s;pointer-events:none}
#toast.hien{opacity:1}
#tai{position:fixed;inset:0;background:rgba(242,246,245,.6);display:grid;place-items:center;z-index:40}
.xoay{width:38px;height:38px;border:4px solid var(--phu);border-top-color:var(--chinh);border-radius:50%;animation:x 1s linear infinite}
@keyframes x{to{transform:rotate(360deg)}}
.hopThoai{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:45}
.hopThoai .bang2{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 18px 26px}
.hopThoai h4{font-size:16px;margin-bottom:10px}


/* xếp ca */
.xcDau{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tuanNav{display:flex;align-items:center;gap:6px;background:#fff;border-radius:10px;padding:4px 6px;font-size:13.5px}
.tuanNav button{padding:4px 10px;border-radius:7px;background:var(--nen);font-weight:700}
.nNho.cam{background:var(--nhan);color:#fff}
.luuTT{font-size:12px;color:var(--mo);margin:0 2px 10px}
.chipXC{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 8px;border-radius:8px;margin:2px 4px 2px 0;white-space:nowrap}
.chipXC i{font-style:normal;opacity:.6;cursor:pointer;padding:0 2px}
.chipXC.sai{outline:2px solid var(--do);outline-offset:1px}
.xcLuoi .chipXC{display:block;position:relative;white-space:normal;line-height:1.25;margin:2px 0;padding:3px 6px;font-size:11.5px}
.xcLuoi .chipXC b{font-weight:600}
.xcLuoi .chipXC i{position:absolute;right:2px;top:50%;transform:translateY(-50%);display:none;background:#fff;border-radius:6px;opacity:1;padding:0 5px}
.xcLuoi .chipXC:hover i{display:block}
@media (hover:none){.xcLuoi .chipXC i{display:block;position:static;transform:none;display:inline;background:none}}
.xcLuoi{display:none;padding:0;overflow-x:auto}
.xcLuoi table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:760px}
.xcLuoi thead th{font-size:12px;color:var(--mo);padding:10px 6px;text-align:left;border-bottom:1px solid var(--vien)}
.xcLuoi thead th.le{color:var(--do)}
.xcLuoi tbody th{width:100px;text-align:left;padding:8px 10px;vertical-align:top;font-size:12.5px;border-right:1px solid var(--vien)}
.xcLuoi tbody th span{display:block;font-size:10.5px;color:var(--mo);font-weight:500}
.xcLuoi td{padding:5px;vertical-align:top;border-bottom:1px solid var(--vien);border-right:1px solid #EEF3F2;cursor:pointer}
.xcLuoi td:hover{background:#F7FBFA}
.xcLuoi tr.chinh th{background:#F2F9F8;color:var(--chinh)}
.xcLuoi tr.off td,.xcLuoi tr.off th{background:#F6F6F6}
.themO{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;border:1.5px dashed var(--phu);color:var(--chinh2);font-size:14px;margin:2px 0}
.ngayTabs{display:flex;gap:5px;margin-bottom:10px}
.ngayTabs button{flex:1;background:#fff;border-radius:10px;padding:6px 0;font-size:10.5px;color:var(--mo);font-weight:600}
.ngayTabs button b{display:block;font-size:15px;color:var(--chu)}
.ngayTabs button{position:relative}.ngayTabs button.coLoi:after{content:'';position:absolute;top:4px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--do)}
.ngayTabs button.on{background:var(--chinh);color:var(--phu)}.ngayTabs button.on b{color:#fff}
.caXC{margin-bottom:8px;padding:10px 12px}.caXC.off{background:#F6F6F6}
.caXC .t{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13.5px;margin-bottom:6px}
.caXC .t small{color:var(--mo);font-weight:500;font-size:11.5px}
.caXC .t em{font-style:normal;font-size:10.5px;background:var(--xanh-nen);color:var(--xanh);padding:2px 7px;border-radius:9px}
.themNut{display:inline-block;font-size:12px;font-weight:700;color:var(--chinh2);padding:4px 9px;border:1.5px dashed var(--phu);border-radius:8px;margin-top:2px;cursor:pointer}
.demXC{display:grid;grid-template-columns:1fr 28px 48px 58px;gap:4px;align-items:center;padding:6px 0;border-bottom:1px solid #EEF3F2;font-size:13px}
.demXC small{color:var(--mo);font-size:11px}.demXC b{text-align:right}.demXC>span:last-child{text-align:right;font-size:12px}
.thieuXC{color:var(--do);font-weight:700;background:var(--do-nen);padding:2px 7px;border-radius:9px}
.xcBoCuc{display:grid;grid-template-columns:1fr;gap:12px}
.dsChon{max-height:52vh;overflow-y:auto}
.itChon{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #EEF3F2;cursor:pointer}
.itChon input{width:20px;height:20px;accent-color:var(--chinh);flex:none}
.itChon .av{width:32px;height:32px;font-size:11px}
.itChon .tt{flex:1;font-weight:600;font-size:13.5px}.itChon .tt span{display:block;font-size:11.5px;color:var(--mo);font-weight:500}
.itChon em{font-style:normal;font-size:11.5px;font-weight:700}
.itChon.tat{opacity:.45;cursor:default}
/* ---------- Máy tính ---------- */
@media (min-width:960px){
  .navDuoi{display:none}
  .chinh{padding-bottom:30px}
  .sidebar{display:flex;flex-direction:column;width:240px;background:var(--chinh);color:var(--phu);padding:22px 14px;gap:4px;position:sticky;top:0;height:100vh;flex:none}
  .sidebar .thuongHieu{display:flex;align-items:center;gap:10px;margin:0 8px 26px}
  .sidebar .tenApp small{color:var(--phu2)}.sidebar .tenApp b{color:#fff;font-size:19px}
  .sidebar button{text-align:left;padding:11px 13px;border-radius:11px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;color:var(--phu)}
  .sidebar button.on{background:rgba(255,255,255,.13);color:#fff}
  .sidebar button i{font-style:normal;background:var(--nhan);color:#fff;border-radius:20px;font-size:11px;padding:1px 8px}
  .sidebar .guiNgay{background:var(--nhan);color:#fff;justify-content:center;margin:6px 0 14px}
  .sidebar .toi{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px 8px;border-top:1px solid rgba(255,255,255,.12);font-size:13px;color:#fff;font-weight:600}
  .sidebar .toi span{display:block;font-size:11.5px;color:var(--phu);font-weight:500}
  .dau{background:transparent;color:var(--chu);padding:26px 28px 4px}
  .dau .hang .logo,.dau .hang .tenApp,.dau .chuong{display:none}
  .chao{color:var(--mo)}.chao b{color:var(--chinh);font-size:24px}
  .noiDung{padding:18px 28px}
  .soLieu{margin-top:0;grid-template-columns:repeat(4,1fr)}
  .luoi2{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:start}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .dinhNut{bottom:16px}
  .formRong{max-width:640px}
  .hopThoai{align-items:center}.hopThoai .bang2{border-radius:20px}
  .xcLuoi{display:block}.xcNgay{display:none}
  .xcBoCuc{grid-template-columns:1fr 290px}
}
@media (min-width:900px) and (max-width:1279px){.xcBoCuc{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- MÀN CHỜ: hiện sẵn, JS chạy được thì tự ẩn. Nếu trình duyệt không chạy được app, người dùng vẫn thấy hướng dẫn thay vì trang trắng. -->
<div id="choMo">
  <div class="hopDN" style="text-align:center">
    <div class="logoLon" style="justify-content:center"><div class="logo">H</div><div class="tenApp"><small>HUMAN OF</small><b>TENS</b></div></div>
    <div class="xoay" style="margin:18px auto"></div>
    <p style="color:#5B6B69;font-size:14px;line-height:1.5">Đang mở app...<br>Nếu trang đứng ở đây quá lâu, bạn kiểm tra mạng rồi tải lại trang.</p>
  </div>
</div>

<!-- ĐĂNG NHẬP -->
<div id="dangNhap" class="an">
  <div class="hopDN">

<!-- APP -->
<div id="app" class="an">
  <aside class="sidebar" id="sidebar"></aside>

<div id="toast"></div>
<div id="tai" class="an"><div class="xoay"></div></div>
<div id="hopThoai" class="hopThoai an"></div>

<script>
/* ================== Kết nối máy chủ ================== */
var S = { token: null, d: null, trang: 'home', don: {}, kiemTra: null, duyet: null, tq: null, loc: 'Tất cả', tabDuyet: 'cho', tuan: null };
var LOAI = [
  { k: 'Nghỉ phép', ic: '🌴', nen: 'var(--nhat)' }, { k: 'Đổi ca', ic: '🔁', nen: 'var(--nen-nhan)' },
  { k: 'Xin đi muộn', ic: '⏰', nen: 'var(--vang-nen)', ngan: 'Xin muộn' }, { k: 'Làm online', ic: '💻', nen: 'var(--xanh-nen)' }
];
var LOAI_NGHI = ['Nghỉ phép', 'Nghỉ ốm', 'Nghỉ việc riêng có lương', 'Nghỉ không lương', 'Nghỉ thai sản'];
var THU = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];

// Địa chỉ API: web app Apps Script gắn với file "Tenschool - Quản trị nhân sự" (giữ nguyên khi tạo phiên bản mới).
var API = 'https://script.google.com/macros/s/AKfycbyXg-lVuzdEbazCHlmET2u7Py7HLRi9aJJIIZAgMEQAYFPMw_HjV40LPq_ElpYvmZGuzQ/exec';
// Thao tác chỉ đọc: lỗi mạng thì tự gửi lại. Thao tác ghi (gửi đơn, duyệt, lưu lịch, gửi mã...) không tự gửi lại để tránh trùng.
var DOC_LAI = { khoiDong: 1, lichTuan: 1, kiemTraDon: 1, danhSachDuyet: 1, tongQuan: 1, thongBao: 1, xepCa_moTuan: 1, xepCa_xemTuan: 1, xepCa_giuKhoa: 1, xepCa_nhaKhoa: 1 };

/** Gọi máy chủ: POST text/plain {fn, args} (không cần preflight nên gọi thẳng từ GitHub Pages sang Google được). */
function goiMayChu(fn, args, xong, loi, soLan) {
  var lan = 0, toiDa = soLan || 1;
  var thu = function () {
    lan++;
    // Giới hạn chờ: đọc 25 giây (rồi gửi lại), ghi 60 giây (không gửi lại). Không để vòng xoay quay mãi.
    var dk = null, hen = null, hetGio = false;
    if (typeof AbortController != 'undefined') { dk = new AbortController(); hen = setTimeout(function () { hetGio = true; dk.abort(); }, toiDa > 1 ? 25000 : 60000); }
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }), redirect: 'follow', signal: dk ? dk.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (kq) { clearTimeout(hen); xong(kq); })
      .catch(function (e) {
        clearTimeout(hen);
        if (lan < toiDa) setTimeout(thu, Math.min(8000, 1500 * lan)); else loi({ hetGio: hetGio, loi: e });
      });
  };
  thu();
}
function goi(ham, args, xong, loi, soLan) {
  hienTai(true);
  goiMayChu(ham, args, function (kq) { hienTai(false); xong(kq); },
    function (e) { hienTai(false); (loi || toast)(thongBaoLoiMang(e), e); }, soLan);
}
var GHI_NHAC = { guiDon: 'Bạn mở mục Đơn của tôi kiểm tra đơn đã lên chưa rồi mới gửi lại, tránh trùng đơn.', xepCa_luu: 'Bạn tải lại lịch để kiểm tra đã lưu chưa.', xepCa_chot: 'Bạn tải lại lịch để kiểm tra đã chốt chưa.' };
function thongBaoLoiMang(e, hanhDong) {
  if (e && e.hetGio) return 'Máy chủ chưa phản hồi sau 60 giây. ' + (GHI_NHAC[hanhDong] || 'Bạn kiểm tra lại kết quả trước khi thao tác tiếp.');
  return 'Mất kết nối, thử lại.';
}
function api(hanhDong, duLieu, xong, imLang, khiLoi) {
  var cb = function (kq) {
    if (kq && kq.hetPhien) { dangXuat(true); return; }
    if (!kq || !kq.ok) { if (khiLoi) khiLoi(kq || {}); else toast((kq && kq.loi) || 'Có lỗi, thử lại.'); return; }
    xong(kq.data !== undefined ? kq.data : kq, kq);
  };
  var loiMang = function (t, e) { var m = thongBaoLoiMang(e, hanhDong); if (khiLoi) khiLoi({ loi: m }); else if (!imLang) toast(m); };
  var soLan = DOC_LAI[hanhDong] ? 3 : 1;
  if (imLang) goiMayChu('api', [S.token, hanhDong, duLieu], cb, function (e) { loiMang('', e); }, soLan);
  else goi('api', [S.token, hanhDong, duLieu], cb, loiMang, soLan);
}
function luu(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function doc(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

/* ================== Tiện ích ================== */
function $(id) { return document.getElementById(id); }
function e(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function hienTai(b) { $('tai').classList.toggle('an', !b); }
function toast(t) { var x = $('toast'); x.textContent = t; x.classList.add('hien'); clearTimeout(x._t); x._t = setTimeout(function () { x.classList.remove('hien'); }, 3200); }
function dn(k) { if (!k) return ''; var p = k.split('-'); return p[2] + '/' + p[1]; }
function dnd(k) { if (!k) return ''; var p = k.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function thuK(k) { var p = k.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay(); }
function congK(k, n) { var p = k.split('-'); var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)); return d.toISOString().slice(0, 10); }
function so(n) { return String(n).replace('.', ','); }
function khoang(d) { return d.den && d.den != d.tu ? dn(d.tu) + ' - ' + dn(d.den) : dnd(d.tu); }
function vietTat(t) { var p = String(t || '').trim().split(/\s+/); return ((p.length > 1 ? p[0][0] : '') + (p[p.length - 1] || ' ')[0]).toUpperCase(); }
var MAU_AV = ['#13707A', '#6A4FD1', '#D35400', '#1E9E5A', '#C0392B', '#2D6CDF', '#8E44AD', '#B47B00'];
function mauAv(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 997; return MAU_AV[h % MAU_AV.length]; }
function tagTT(t) {
  var c = { 'Đã duyệt': 't-ok', 'Từ chối': 't-no', 'Đã hủy': 't-huy', 'Chờ duyệt': 't-cho', 'Chờ duyệt cấp 2': 't-cho' }[t] || 't-huy';
  return '<span class="nhanTag ' + c + '">' + e(t == 'Chờ duyệt cấp 2' ? 'Chờ duyệt cấp 2' : t) + '</span>';
}
function icLoai(l) {
  if (LOAI_NGHI.indexOf(l) >= 0) return ['🌴', 'var(--nhat)'];
  var x = LOAI.filter(function (o) { return o.k == l; })[0];
  return x ? [x.ic, x.nen] : ['📄', 'var(--nen)'];
}
function moTaDon(d) {
  if (LOAI_NGHI.indexOf(d.loai) >= 0) return khoang(d) + (d.buoi && d.buoi != 'Cả ngày' ? ' (' + d.buoi.toLowerCase() + ')' : '') + ' · ' + so(d.soNgay) + ' ngày' + (d.truPhep ? ' · trừ ' + so(d.truPhep) + ' phép' : '') + (d.khongLuong ? ' · ' + so(d.khongLuong) + ' không lương' : '');
  if (d.loai == 'Đổi ca') return dnd(d.tu) + ': ' + d.caCu + (d.caMoi ? ' → ' + (d.ngayMoi && d.ngayMoi != d.tu ? dn(d.ngayMoi) + ' ' : '') + d.caMoi : ' (bỏ ca)') + (d.tenDoiVoi ? ' · đổi với ' + d.tenDoiVoi : '');
  if (d.loai == 'Xin đi muộn') return dnd(d.tu) + (d.caCu ? ', ' + d.caCu : '') + (d.ghiChu ? ' · ' + d.ghiChu.split('.')[0] : '');
  return dnd(d.tu);
}

/* ================== Đăng nhập ================== */
function guiMa() {
  var m = $('oMail').value.trim();
  if (!/@/.test(m)) { $('loiDN').textContent = 'Nhập đúng địa chỉ mail.'; return; }
  $('loiDN').textContent = '';
  goi('guiMaDangNhap', [m], function (kq) {
    if (!kq.ok) { $('loiDN').textContent = kq.loi; return; }
    luu('hot_mail', m);
    $('moTaMa').textContent = 'Mã đã gửi tới ' + m + ', có hiệu lực 10 phút. Kiểm tra cả mục Thư rác nếu chưa thấy.';
    $('buocMail').classList.add('an'); $('buocMa').classList.remove('an'); $('oMa').focus();
  }, function (t, e) {
    if (e && e.hetGio) {
      // Máy chủ có thể đã gửi mail nhưng phản hồi chậm: vẫn cho nhập mã
      luu('hot_mail', m);
      $('moTaMa').textContent = 'Máy chủ phản hồi chậm. Nếu mail ' + m + ' đã nhận được mã thì nhập mã bên dưới. Chưa nhận sau vài phút thì bấm "Đổi mail khác" để gửi lại.';
      $('buocMail').classList.add('an'); $('buocMa').classList.remove('an'); $('oMa').focus();
    } else $('loiDN').textContent = t;
  });
}
function xacNhan() {
  var m = $('oMail').value.trim(), ma = $('oMa').value.trim();
  goi('xacNhanMa', [m, ma], function (kq) {
    if (!kq.ok) { $('loiDN').textContent = kq.loi; return; }
    S.token = kq.token; luu('hot_token', kq.token); batDau();
  }, function (t) { $('loiDN').textContent = t; });
}
function veMail() { $('buocMa').classList.add('an'); $('buocMail').classList.remove('an'); $('loiDN').textContent = ''; }
function dangXuat(hetPhien) {
  if (!hetPhien && S.token) goiMayChu('api', [S.token, 'dangXuat', {}], function () {}, function () {});
  S.token = null; luu('hot_token', null);
  anChoMo(); $('app').classList.add('an'); $('dangNhap').classList.remove('an'); veMail();
  if (hetPhien) $('loiDN').textContent = 'Phiên đăng nhập đã hết, vui lòng đăng nhập lại.';
}
$('oMa').addEventListener('keydown', function (ev) { if (ev.key == 'Enter') xacNhan(); });
$('oMail').addEventListener('keydown', function (ev) { if (ev.key == 'Enter') guiMa(); });

function anChoMo() { $('choMo').classList.add('an'); }
// Mở app: không bao giờ để trang trắng. Lỗi hoặc quá 25 giây thì hiện màn đăng nhập kèm lỗi và nút Thử lại.
function batDau() {
  var xong = false;
  var hen = setTimeout(function () { if (!xong) loiMo('App phản hồi quá lâu, có thể do mạng chậm.'); }, 40000);
  api('khoiDong', {}, function (d) {
    xong = true; clearTimeout(hen);
    S.d = d; S.tuan = d.lich.tuan;
    anChoMo(); $('loiDN').textContent = '';
    $('dangNhap').classList.add('an'); $('app').classList.remove('an');
    ve();
  }, false, function (kq) { xong = true; clearTimeout(hen); loiMo(kq.loi); });
}
function loiMo(loi) {
  anChoMo(); hienTai(false);
  $('app').classList.add('an'); $('dangNhap').classList.remove('an');
  $('loiDN').innerHTML = 'Chưa mở được dữ liệu: ' + e(loi || 'lỗi không rõ') + '<br><button class="nutPhu" onclick="thuLai()">Thử lại</button>';
}
function thuLai() { $('loiDN').textContent = ''; $('dangNhap').classList.add('an'); $('choMo').classList.remove('an'); batDau(); }
function taiLai(sau) { api('khoiDong', {}, function (d) { S.d = d; if (sau) sau(); ve(); }); }

/* ================== Điều hướng ================== */
function cacMuc() {
  var h = S.d.hoSo, m = [{ k: 'home', t: 'Trang chủ', ic: '🏠' }, { k: 'lich', t: 'Lịch ca', ic: '📅' }, { k: 'gui', t: 'Gửi đơn', ic: '+' }, { k: 'don', t: 'Đơn của tôi', ic: '📄' }];
  if (h.laDuyet) m.push({ k: 'duyet', t: 'Duyệt đơn', ic: '✅', so: S.d.choDuyet });
  if (S.d.xepCa && S.d.xepCa.length) m.push({ k: 'xep', t: 'Xếp ca', ic: '🗓' });
  if (h.laQuanTri) { m.push({ k: 'tq', t: 'Tổng quan', ic: '📊' }); m.push({ k: 'tb', t: 'Thông báo', ic: '🔔', so: S.d.thongBaoMoi }); }
  m.push({ k: 'toi', t: 'Tôi', ic: '👤' });
  return m;
}
function di(trang, tham) {
  if (S.trang == 'xep' && trang != 'xep') roiXepCa();
  S.trang = trang;
  if (trang == 'xep') { moXepCa((tham && tham.team) || (S.xc && S.xc.team) || S.d.xepCa[0], (tham && tham.tuan) || (S.xc && S.xc.tuan) || congK(S.d.lich.tuan, 0)); }
  if (trang == 'tb') { api('thongBao', {}, function (x) { S.tb = x; S.d.thongBaoMoi = 0; ve(); }); }
  if (trang == 'gui') { S.don = Object.assign({ loai: 'Nghỉ phép', buoi: 'Cả ngày', loaiNghi: 'Nghỉ phép' }, tham || {}); S.kiemTra = null; }
  if (trang == 'duyet') { api('danhSachDuyet', {}, function (x) { S.duyet = x; ve(); }); }
  if (trang == 'tq') { api('tongQuan', {}, function (x) { S.tq = x; ve(); }); }
  ve(); window.scrollTo(0, 0);
  if (trang == 'gui') kiemTraNgay();
}

function ve() {
  var h = S.d.hoSo, m = cacMuc();
  // sidebar
  $('sidebar').innerHTML = '<div class="thuongHieu"><div class="logo">H</div><div class="tenApp"><small>HUMAN OF</small><b>TENS</b></div></div>' +
    '<button class="guiNgay" onclick="di(\'gui\')">+ Gửi đơn mới</button>' +
    m.filter(function (x) { return x.k != 'gui' && x.k != 'toi'; }).map(function (x) {
      return '<button class="' + (S.trang == x.k ? 'on' : '') + '" onclick="di(\'' + x.k + '\')">' + x.t + (x.so ? '<i>' + x.so + '</i>' : '') + '</button>';
    }).join('') +
    '<div class="toi"><div class="av" style="background:var(--nhan)">' + vietTat(h.ten) + '</div><div>' + e(h.ten) + '<span>' + e(h.vaiTro) + ' · ' + e(h.team) + '</span></div></div>' +
    '<button onclick="dangXuat()">Đăng xuất</button>';
  // nav dưới: tối đa 5 nút
  var duoi = [m[0], m[1], m[2], h.laDuyet ? m.filter(function (x) { return x.k == 'duyet'; })[0] : m[3], m[m.length - 1]];
  $('navDuoi').innerHTML = duoi.map(function (x) {
    if (x.k == 'gui') return '<button class="cong" onclick="di(\'gui\')" aria-label="Gửi đơn">+</button>';
    return '<button class="' + (S.trang == x.k || (x.k == 'toi' && ['don', 'tq', 'toi'].indexOf(S.trang) >= 0 && !duoi.some(function (y) { return y.k == S.trang; })) ? 'on' : '') + '" onclick="di(\'' + x.k + '\')"><b>' + x.ic + '</b>' + x.t + (x.so ? '<span class="huy">' + x.so + '</span>' : '') + '</button>';
  }).join('');
  // header
  var dau = '<div class="hang"><div class="logo">H</div><div class="tenApp"><small>HUMAN OF</small><b>TENS</b></div>' +
    (h.laDuyet ? '<button class="chuong" onclick="di(\'duyet\')">🔔' + (S.d.choDuyet ? '<i>' + S.d.choDuyet + '</i>' : '') + '</button>' : '') + '</div>';
  var tieuDe = { lich: 'Lịch ca của tôi', gui: 'Gửi đơn', don: 'Đơn của tôi', duyet: 'Duyệt đơn', tq: 'Tổng quan', toi: 'Tài khoản', xep: 'Xếp ca', tb: 'Thông báo' }[S.trang];
  if (S.trang == 'home') {
    var gio = new Date().getHours();
    dau += '<div class="chao">' + (gio < 11 ? 'Chào buổi sáng,' : gio < 14 ? 'Chào buổi trưa,' : gio < 18 ? 'Chào buổi chiều,' : 'Chào buổi tối,') + '<b>' + e(h.ten) + '</b></div><div style="height:22px"></div>';
  } else {
    dau += '<div class="chao" style="margin-top:12px"><b>' + tieuDe + '</b></div>';
  }
  $('dau').innerHTML = dau;
  $('noiDung').innerHTML = ({ home: veHome, lich: veLich, gui: veGui, don: veDon, duyet: veDuyet, tq: veTQ, toi: veToi, xep: veXep, tb: veTB }[S.trang])();
}

/* ================== Trang chủ ================== */
function veSoLieu() {
  var d = S.d, q = d.quy, l = d.lich;
  return '<div class="soLieu">' +
    '<div class="so"><div class="n">' + (q.coPhep ? so(q.conLai) + '<small> ngày</small>' : '–') + '</div><div class="l">' + (q.coPhep ? 'Phép còn lại' + (q.dangCho ? ' (' + so(q.dangCho) + ' chờ duyệt)' : '') : e(q.lyDo)) + '</div></div>' +
    '<div class="so ' + (d.muon.da >= d.muon.toiDa ? 'cam' : '') + '"><div class="n">' + d.muon.da + '<small>/' + d.muon.toiDa + '</small></div><div class="l">Lần xin muộn tháng này</div></div>' +
    '<div class="so ' + (l.chuan && l.caChinh < l.chuan ? 'do' : '') + '"><div class="n">' + l.caChinh + (l.chuan ? '<small>/' + l.chuan + '</small>' : '') + '</div><div class="l">Ca chính tuần này</div></div>' +
    '</div>';
}
function veCaList(l, gioiHan) {
  var ds = l.ngay.filter(function (n) { return n.ca.length || n.trangThai == 'Nghỉ' || n.trangThai == 'Nghỉ lễ'; });
  if (gioiHan) ds = ds.filter(function (n) { return n.ngay >= S.d.homNay; }).slice(0, gioiHan);
  if (!ds.length) return '<div class="trong">Chưa có ca nào được xếp.</div>';
  return ds.map(function (n) {
    var tag = n.trangThai == 'Online' ? '<span class="nhanTag t-onl">Online</span>' : n.trangThai == 'Văn phòng' ? '<span class="nhanTag t-vp">Văn phòng</span>' : n.trangThai ? '<span class="nhanTag t-nghi">' + n.trangThai + '</span>' : '';
    var phu = n.trangThai == 'Online' ? 'Ngày làm online, không cần chấm công' : n.moc ? 'Chấm trước ' + n.moc : (n.trangThai == 'Nghỉ' ? 'Đã duyệt nghỉ' : '');
    if (n.nuaNgay) phu += ' · ' + n.nuaNgay;
    if (n.xinMuon) phu += ' · đã duyệt xin muộn';
    return '<div class="ca"><div class="ngay ' + (n.ngay == S.d.homNay ? 'homNay' : '') + '">' + THU[n.thu] + '<b>' + n.ngay.slice(8) + '</b></div><div class="caTT">' + (e(n.ca.join(' + ')) || '–') + '<span>' + e(phu) + '</span></div>' + tag + '</div>';
  }).join('');
}
function veDonList(ds, choHuy) {
  if (!ds.length) return '<div class="trong">Chưa có đơn nào.</div>';

function datDon(k, v) {
  S.don[k] = v;
  if (k == 'tu' && (!S.don.den || S.don.den < v || S.don.loai != 'Nghỉ phép')) S.don.den = v;
  if (k == 'tu' && S.don.loai == 'Đổi ca' && !S.don.ngayMoi) S.don.ngayMoi = v;
  if (k == 'den' && v != S.don.tu) S.don.buoi = 'Cả ngày';
  if (k == 'loai') { S.don = { loai: v, buoi: 'Cả ngày', loaiNghi: 'Nghỉ phép', tu: S.don.tu, den: S.don.tu, lyDo: S.don.lyDo }; }
  ve(); kiemTraNgay();
}
function donGui() {
  var d = Object.assign({}, S.don);
  if (d.loai == 'Nghỉ phép') d.loai = d.loaiNghi;
  return d;
}
function demNgayLamMay(tu, den, buoi) {
  var n = 0, le = S.d.ngayLe || [];
  for (var k = tu; k <= (den || tu); k = congK(k, 1)) if (thuK(k) != 0 && le.indexOf(k) < 0) n++;
  return n == 1 && /Sáng|Chiều/.test(buoi || '') ? 0.5 : n;
}
function tamTinh(d) {
  var k = { loi: [], canhBao: [], soNgay: 0, truPhep: 0, khongLuong: 0, quy: S.d.quy, canDuyet: S.kiemTra ? S.kiemTra.canDuyet : '', tam: true };
  if (LOAI_NGHI.indexOf(d.loai) >= 0 && d.tu && (d.den || d.tu) >= d.tu) {
    k.soNgay = demNgayLamMay(d.tu, d.den, d.buoi);
    if (d.loai == 'Nghỉ phép' || d.loai == 'Nghỉ ốm') {
      var con = S.d.quy.coPhep ? Math.max(0, S.d.quy.conLai) : 0;
      k.truPhep = Math.min(k.soNgay, con); k.khongLuong = k.soNgay - k.truPhep;
    } else if (d.loai == 'Nghỉ không lương') k.khongLuong = k.soNgay;
  }
  return k;
}
function kiemTraNgay() {
  clearTimeout(S._kt);
  if (!S.don.tu) { S.kiemTra = null; return; }
  var d = donGui(), ma = JSON.stringify(d);
  S.kiemTra = tamTinh(d); S.dangKT = ma;
  if (S.trang == 'gui') ve();
  S._kt = setTimeout(function () {
    api('kiemTraDon', d, function (k) { if (S.dangKT != ma) return; S.kiemTra = k; S.dangKT = null; if (S.trang == 'gui') ve(); }, true,
      function (kq) { if (S.dangKT != ma) return; S.dangKT = null; S.kiemTra.loi = [kq.loi || 'Không kiểm tra được, thử lại.']; if (S.trang == 'gui') ve(); });
  }, 300);
}

    for (var d = 0; d < 7; d++) {
      var a = cu[g.ma][d], b = moi[g.ma][d];
      var them = b.filter(function (t) { return a.indexOf(t) < 0; }), bot = a.filter(function (t) { return b.indexOf(t) < 0; });
      if (them.length || bot.length) out.push(TEN_THU[d] + ' ' + dn(S.xc.data.ngay[d]) + ', ' + g.ten + ': ' + (them.length ? 'thêm ' + them.join(', ') : '') + (them.length && bot.length ? '; ' : '') + (bot.length ? 'bỏ ' + bot.join(', ') : ''));
    }
  });
  return out;
}
function luuSauChot() {
  var ds = soSanhMay(S.xc.goc, S.xc.luoi);
  hoi('Lưu thay đổi sau khi chốt', 'Các thay đổi sẽ được lưu và gửi thông báo cho chị Ngọc, chị Trang:\n' + ds.join('\n'), false, function () { luuXep(true); });
}
function chepTuanTruoc() {
  var x = S.xc.data, team = x.team, tuan = x.tuan;
  api('xepCa_xemTuan', { team: team, tuan: congK(tuan, -7) }, function (p) {
    var coTen = x.nhom.some(function (g) { return S.xc.luoi[g.ma].some(function (ds) { return ds.length; }); });
    var lam = function () { S.xc.luoi = saoChep(p.luoi); daDoi(); toast('Đã chép lịch tuần ' + dn(congK(tuan, -7)) + '. Sửa lại cho tuần này.'); };
    if (coTen) hoi('Chép tuần trước?', 'Lịch hiện tại của tuần này sẽ bị thay bằng lịch tuần trước.', false, lam); else lam();
  });
}
function chotLich() {
  var L = loiXep();
  var luu = function () { api('xepCa_chot', { team: S.xc.team, tuan: S.xc.tuan }, function (c) { S.xc.data.chot = c; toast('Đã chốt lịch tuần.'); ve(); }); };
  var lam = function () { clearTimeout(S._luu); if (S.xc.ban || S.xc.dangLuu) luuXep(false, luu); else luu(); };
  hoi('Chốt lịch tuần', L.soDo ? 'Còn ' + L.soDo + ' lỗi đỏ chưa sửa. Vẫn chốt lịch?' : 'Sau khi chốt, mỗi lần sửa sẽ tự báo chị Ngọc và chị Trang.', false, lam);
}

/* ================== Thông báo ================== */
function veTB() {
  if (!S.tb) return '<div class="trong">Đang tải...</div>';
  return '<div class="the formRong">' + (S.tb.ds.length ? S.tb.ds.map(function (t) {
    return '<div class="don" style="align-items:flex-start"><div class="ic" style="background:var(--nen-nhan)">🗓</div><div class="tt">' + e(t.loai) + ' · ' + e(t.luc) + '<span style="white-space:pre-line">' + e(t.noiDung) + '</span></div></div>';
  }).join('') : '<div class="trong">Chưa có thông báo nào trong 30 ngày.</div>') + '</div>';
}

/* ================== Hộp thoại ================== */
function hoi(tieuDe, moTa, coNhap, ok) {
  var h = $('hopThoai');
  h.innerHTML = '<div class="bang2"><h4>' + e(tieuDe) + '</h4><p style="color:var(--mo);font-size:13px;margin-bottom:10px;white-space:pre-line;max-height:45vh;overflow-y:auto">' + e(moTa) + '</p>' +
    (coNhap ? '<textarea id="oHoi" class="o" style="height:70px;resize:none"></textarea>' : '') +
    '<div class="haiNut"><button class="nTuChoi" style="color:var(--mo)" onclick="dongHoi()">Thôi</button><button class="nDuyet" id="nutHoi">Đồng ý</button></div></div>';
  h.classList.remove('an');
  $('nutHoi').onclick = function () { var v = coNhap ? $('oHoi').value.trim() : ''; if (coNhap && !v) { toast('Nhập lý do.'); return; } dongHoi(); ok(v); };
}
function dongHoi() { $('hopThoai').classList.add('an'); }

/* ================== Khởi động ================== */
(function () {
  S.token = doc('hot_token');
  var m = doc('hot_mail'); if (m) $('oMail').value = m;
  if (S.token) batDau(); else { anChoMo(); $('dangNhap').classList.remove('an'); }
})();
</script>
